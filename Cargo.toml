[package]
name = "qubit-cpp-infra-verify"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "CMake verification and reusable build contexts for C++ infrastructure"
repository = "https://github.com/qubit-ltd/cpp-infra-verify"
include = ["src/**", "build.rs", "conf/**", "assets/**", "schemas/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "README.zh_CN.md", "rust-toolchain.toml"]
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
readme = "README.md"

[[bin]]
name = "cpp-infra-verify"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
fs2 = "0.4"
thiserror = "2"
wait-timeout = "0.2"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
roxmltree = "0.20"
tar = "0.4"
flate2 = "1"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
